<title>元朗大富翁 · 第一章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@700;900&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen street-directory map of Central with three zoom levels (街區 → 地段 → 細節); HUD floats top, deed/bank card + month button float bottom */
:root{
  --sea:#BCD7E3; --land:#E9E6DD; --ink:#1D2530; --dim:#5E6672; --line:rgba(29,37,48,.14); --panel:#FFFFFF;
  --me:#D33F35; --rival:#2E5C9A; --gold:#B78716; --dev:#5B3F8C;
  --park:#A9D18E; --gov:#C3C6CC; --rel:#CDB6E4; --comm:#B8D3EC; --mark:#F2C46B; --bank:#1F7A66;
  --display:"Noto Serif HK","Songti TC",serif; --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.drag{cursor:grabbing}
.blk{stroke:#CFC9B9;stroke-width:1.2;cursor:zoom-in}
.blk:hover{stroke:#6E6757;stroke-width:3}
.lot{stroke:#CFC9B9;stroke-width:1.2;cursor:pointer}
.lot:hover{stroke:#6E6757;stroke-width:2}
.lot.me{fill:var(--me)!important;stroke:#8E241D}
.lot.rv{fill:var(--rival)!important;stroke:#173A6A}
.bo{fill:none;stroke:#8F8775;stroke-width:1.6;pointer-events:none}
.nm{font-family:var(--display);font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:.32em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ln{font-family:var(--body);font-weight:500;fill:#3B3426;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:.3em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rl{font-family:var(--body);font-weight:500;fill:#4A4232;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:.35em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.al{font-family:var(--display);font-weight:900;fill:rgba(29,37,48,.5);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.2em}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(29,37,48,.16)}
.brand{padding:10px 14px;max-width:min(380px,100%)}
h1{font-family:var(--display);font-weight:900;font-size:21px;margin:0;letter-spacing:.06em}
.month{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lod{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font-size:11px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pl{padding:8px 12px;display:grid;grid-template-columns:auto auto;column-gap:10px;row-gap:1px;align-items:baseline;font-variant-numeric:tabular-nums}
.pl .who{grid-column:1/3;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.pl .who i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pl .k{font-size:11px;color:var(--dim)} .pl .v{font-size:15px;font-weight:700;text-align:right}
.pl .v.debt.on{color:var(--me)}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deed{width:min(340px,100%);overflow:hidden}
.deed-h{padding:10px 14px 9px;color:#fff;background:var(--gold)}
.deed-h .tag{font-size:11px;letter-spacing:.16em;opacity:.9}
.deed-h .st{font-family:var(--display);font-weight:900;font-size:19px;line-height:1.25;text-wrap:balance}
.deed-h .sub{font-size:12px;margin-top:2px;opacity:.95}
.deed-b{padding:10px 14px 12px;display:grid;gap:4px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--dim)} .row b{font-weight:700}
.note{margin-top:4px;font-size:12px;color:var(--dim);line-height:1.55}
.act{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{font:500 14px var(--body);border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--me);border-color:var(--me);color:#fff}
button.bankbtn{background:var(--bank);border-color:var(--bank);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;min-width:0}
.log{padding:9px 12px;font-size:12.5px;max-width:340px;display:grid;gap:4px}
.log div{line-height:1.5} .log .new{font-weight:700} .log .old{color:var(--dim)}
.next{pointer-events:auto;font-family:var(--display);font-weight:900;font-size:17px;padding:12px 22px;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 28px rgba(29,37,48,.28)}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:46%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;padding:0;font-size:18px;box-shadow:0 4px 14px rgba(29,37,48,.15)}
#end{position:absolute;inset:0;background:rgba(29,37,48,.55);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#end .card{padding:22px;max-width:360px;text-align:center}
#end h2{font-family:var(--display);font-weight:900;font-size:26px;margin:0 0 8px}
#end p{margin:0 0 14px;color:var(--dim);line-height:1.6}
@media (max-width:620px){
  .deed{width:100%} .right{width:100%;flex-direction:row;align-items:flex-end;justify-content:space-between} .log{max-width:none;flex:1;min-width:0;font-size:12px}
  h1{font-size:18px} .legend{font-size:10.5px} .zoom{top:42%} .deed-b{padding:8px 12px 10px} .deed-h .st{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){.lot,.blk{transition:fill .25s}}
</style>
<div id="app">
  <svg id="map" role="img" aria-label="元朗市及周邊農地街道地圖，縮細睇分區，放大逐個街區買賣"></svg>
  <div class="top">
    <div class="card brand"><h1>元朗大富翁</h1><div class="month"><span id="month"></span><span class="lod" id="lod"></span></div>

  </div>
  <div id="end" hidden><div class="card"><h2 id="endT"></h2><p id="endP"></p><button class="primary" id="again">再玩一局</button></div></div>
</div>

const BUY=M.lots.filter(l=>l.k==='buy'||l.k==='dev'),AREAS=[...new Set(BUY.map(l=>l.a))];
const areaCount={};BUY.forEach(l=>areaCount[l.a]=(areaCount[l.a]||0)+1);
let S,rate=RATE;
const fmt=v=>(Math.round(v*10)/10).toLocaleString('zh-HK')+'億';
const price=l=>l.p*S.pm[l.a];
const ownerOf=l=>S.own[l.id]||(l.k==='dev'?'dev':'');
const owned=(who,a)=>BUY.filter(l=>S.own[l.id]===who&&(!a||l.a===a));
const leader=(who,a)=>owned(who,a).length>=Math.ceil(areaCount[a]*0.15);
const rentOf=l=>{const who=S.own[l.id];let r=price(l)*(l.r/l.p)*S.rm[l.a];if(l.nm)r*=1.2;if(who&&leader(who,l.a))r*=1.5;return r};
const worth=who=>S.cash[who]-(who==='me'?S.debt:0)+owned(who).reduce((s,l)=>s+price(l),0);
const lotName=l=>l.n||(l.s.length?l.s.join(' × ')+' 街區':'無名街區');
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),mix=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function paintLot(id){const e=lotEl[id];if(!e)return;e.classList.toggle('me',S.own[id]==='me');e.classList.toggle('rv',S.own[id]==='rv')}
function paintBlock(bid){const b=M.blocks[bid];if(b.k!=='buy')return;const sh={me:0,rv:0,dev:0},tot=b.lots.reduce((s,i)=>s+M.lots[i].m2,0)||1;
  b.lots.forEach(i=>{const o=ownerOf(M.lots[i]);if(o)sh[o]+=M.lots[i].m2/tot});
  let fill=baseFill(b);const top=Object.entries(sh).sort((a,c)=>c[1]-a[1])[0];
  if(top[1]>0)fill=mix(fill,{me:'#D33F35',rv:'#2E5C9A',dev:'#5B3F8C'}[top[0]],Math.min(1,.25+top[1]*.85));blkEl[bid].setAttribute('fill',fill)}
function paintAll(){M.lots.forEach(l=>paintLot(l.id));M.blocks.forEach(b=>paintBlock(b.id))}
function newGame(){rate=RATE;S={m:1,cash:{me:START,rv:START},debt:0,own:{},pm:{},rm:{},sel:null,log:[]};AREAS.forEach(a=>{S.pm[a]=1;S.rm[a]=1});
  for(const a of ['屏山','南邊圍','元朗東']){const c=BUY.filter(l=>l.a===a&&l.k==='buy'&&l.p<8);for(let i=0;i<2;i++){const l=c[Math.floor(Math.random()*c.length)];if(l&&!S.own[l.id]&&S.cash.rv>=l.p){S.own[l.id]='rv';S.cash.rv-=l.p}}}
  S.log=['第一章：你帶住 60 億嚟到元朗。先喺周邊收平價農地（淺綠色），再打入市中心；縮細睇分區，撳一下放大逐個街區買賣；紫色係大地產商物業，可以用兩倍價收購；銀行可以借錢。'];
  $('end').hidden=true;paintAll();closeCard();hud()}
function hud(){$('month').textContent=`第 ${S.m} 個月 / 共 ${MONTHS} 個月`;
  $('meCash').textContent=fmt(S.cash.me);$('meDebt').textContent=fmt(S.debt);$('meDebt').classList.toggle('on',S.debt>0);$('rvCash').textContent=fmt(S.cash.rv);
  $('meWorth').textContent=fmt(worth('me'));$('rvWorth').textContent=fmt(worth('rv'));
  $('log').innerHTML=S.log.slice(0,innerWidth>620?3:1).map((t,i)=>`<div class="${i?'old':'new'}">${t}</div>`).join('');renderCard()}
function select(id){S.sel=id;gSel.setAttribute('points',pts(M.lots[id].g));$('deed').hidden=false;renderCard()}
const row=(k,v)=>`<div class="row"><span>${k}</span><b>${v}</b></div>`;
function renderCard(){if(S.sel===null)return;const l=M.lots[S.sel],K=KIND[l.k==='buy'&&l.f?'farm':l.k],dh=$('dh');let body='';
  if(l.k==='buy'||l.k==='dev'){const who=ownerOf(l),p=price(l);
    dh.style.background=who==='me'?'var(--me)':who==='rv'?'var(--rival)':who==='dev'?'var(--dev)':'var(--gold)';
    $('dTag').textContent=l.a+' · '+(who==='dev'?l.dev:'可買街區');$('dSt').textContent=lotName(l);$('dSub').textContent=l.n?l.s.join(' × '):'';
    const perks=[];if(l.nm)perks.push('近地標，租金 +20%');if((who==='me'||who==='rv')&&leader(who,l.a))perks.push('地區龍頭，租金 ×1.5');
    const ownTxt=who==='me'?'你嘅物業':who==='rv'?'金牛地產物業':who==='dev'?`${l.dev}持有，收購價係市值兩倍`:'未有業主';
    body=row('佔地',l.m2.toLocaleString('zh-HK')+' 平方米')+row('市值',fmt(p))+row('每月租金',fmt(rentOf(l)))+(l.also&&l.also.length?row('包括',l.also.join('、')):'')+
      `<div class="note">${ownTxt}${perks.length?'，'+perks.join('，'):''} · 你喺${l.a}有 ${owned('me',l.a).length}/${areaCount[l.a]} 個街區</div>`;
    let btn='';if(!who)btn=`<button class="primary" id="act" ${S.cash.me<p?'disabled':''}>買入 ${fmt(p)}</button>`;
    else if(who==='rv')btn=`<button class="primary" id="act" ${S.cash.me<p*1.5?'disabled':''}>收購 ${fmt(p*1.5)}</button>`;
    else if(who==='dev')btn=`<button class="primary" id="act" ${S.cash.me<p*DEV_MULT?'disabled':''}>收購 ${fmt(p*DEV_MULT)}</button>`;
    else btn=`<button id="act">放售 ${fmt(p*0.9)}</button>`;
    body+=`<div class="act">${btn}<button id="close">收起</button></div>`}
  else if(l.k==='bank'){dh.style.background=K.head;$('dTag').textContent='銀行 · 非賣品';$('dSt').textContent=l.n;$('dSub').textContent=l.s.join(' × ');
    const room=LOAN_MAX-S.debt;
    body=row('你嘅貸款',fmt(S.debt))+row('仲可以借',fmt(room))+row('月息',(rate*100).toFixed(2)+'%')+
      `<div class="note">每次借或還 ${LOAN_STEP} 億。利息每個月自動喺現金扣除；遊戲完結時貸款會喺身家扣返。</div>`+
      `<div class="act"><button class="bankbtn" id="borrow" ${room<LOAN_STEP?'disabled':''}>借 ${LOAN_STEP} 億</button><button id="repay" ${S.debt<=0||S.cash.me<Math.min(LOAN_STEP,S.debt)?'disabled':''}>還 ${fmt(Math.min(LOAN_STEP,S.debt))}</button><button id="close">收起</button></div>`}
  else{dh.style.background=K.head;$('dTag').textContent=K.tag+' · 非賣品';$('dSt').textContent=l.n||K.tag;$('dSub').textContent=l.dev?`業主：${l.dev}`:l.s.join(' × ');
    const why={park:'公眾休憩用地，唔可以買賣。',gov:'政府或公共機構用地，唔可以買賣。',rel:'宗教場所，唔可以買賣。',comm:'學校、醫院同社區設施，唔可以買賣。',mark:'城中地標唔放售，但附近地段租金會加 20%。'}[l.k];
    body=row('佔地',l.m2.toLocaleString('zh-HK')+' 平方米')+`<div class="note">${why}</div><div class="act"><button id="close">收起</button></div>`}
  $('dBody').innerHTML=body;
  const a=$('act');if(a)a.onclick=act;const bo=$('borrow');if(bo)bo.onclick=borrow;const re=$('repay');if(re)re.onclick=repay;$('close').onclick=closeCard}
function act(){const l=M.lots[S.sel],who=ownerOf(l),p=price(l);
  if(!who&&S.cash.me>=p){S.cash.me-=p;S.own[l.id]='me';S.log.unshift(`你買入「${lotName(l)}」，用咗 ${fmt(p)}。`)}
  else if(who==='rv'&&S.cash.me>=p*1.5){S.cash.me-=p*1.5;S.cash.rv+=p*1.5;S.own[l.id]='me';S.log.unshift(`你以 ${fmt(p*1.5)} 由金牛地產手上收購「${lotName(l)}」。`)}
  else if(who==='dev'&&S.cash.me>=p*DEV_MULT){S.cash.me-=p*DEV_MULT;S.own[l.id]='me';S.log.unshift(`你以 ${fmt(p*DEV_MULT)} 向${l.dev}收購「${lotName(l)}」。`)}
  else if(who==='me'){S.cash.me+=p*0.9;delete S.own[l.id];S.log.unshift(`你以 ${fmt(p*0.9)} 放售「${lotName(l)}」。`)}
  paintLot(l.id);paintBlock(l.blk);hud()}
function borrow(){S.debt+=LOAN_STEP;S.cash.me+=LOAN_STEP;S.log.unshift(`你喺${M.lots[S.sel].n}借咗 ${LOAN_STEP} 億，總貸款 ${fmt(S.debt)}。`);hud()}
function repay(){const v=Math.min(LOAN_STEP,S.debt);S.debt-=v;S.cash.me-=v;S.log.unshift(`你還咗 ${fmt(v)}，仲欠 ${fmt(S.debt)}。`);hud()}
function closeCard(){if(S)S.sel=null;gSel.setAttribute('points','');$('deed').hidden=true}
const pickA=()=>{const m=['元朗市中心','元朗舊墟','朗屏','水邊圍','南邊圍','屏山','元朗東'];return m[Math.floor(Math.random()*m.length)]};
const EVENTS=[
  ()=>{S.pm['屏山']*=1.15;S.pm['元朗東']*=1.1;return '政府公布北部都會區新發展區規劃，屏山地價升 15%，元朗東升 10%。'},
  ()=>{const a=pickA();S.pm[a]*=0.9;return `${a}有大型甲級寫字樓落成，${a}樓價跌 10%。`},
  ()=>{rate+=0.0025;AREAS.forEach(a=>S.pm[a]*=0.96);return `銀行加息 0.25 厘，貸款月息變 ${(rate*100).toFixed(2)}%，全區樓價跌 4%。`},
  ()=>{AREAS.forEach(a=>S.pm[a]*=1.05);return '樓市氣氛好轉，全區樓價升 5%。'},
  ()=>{S.rm['元朗市中心']*=1.3;return '長假期北上同本地客湧入元朗，市中心商舖租金升 30%，維持一個月。'},
  ()=>{S.typhoon=true;return '八號風球襲港，今個月所有租金收入減半。'},
  ()=>{S.rm['元朗舊墟']*=1.25;return '舊墟美食探店熱潮，元朗舊墟租金升 25%，維持一個月。'},
  ()=>{const mine=owned('me');if(!mine.length)return '今個月風平浪靜。';const l=mine[Math.floor(Math.random()*mine.length)];S.skip=l.id;return `租客走數，「${lotName(l)}」今個月收唔到租。`},
];
function rivalTurn(){const mine=new Set(owned('rv').map(l=>l.a)),bought=[];
  for(let k=0;k<2;k++){const c=BUY.filter(l=>l.k==='buy'&&!S.own[l.id]&&price(l)<=S.cash.rv-15);if(!c.length)break;
    const sc=l=>(mine.has(l.a)?1.5:1)*(l.nm?1.2:1)+Math.random()*.4;c.sort((a,b)=>sc(b)-sc(a));
    const l=c[0];S.cash.rv-=price(l);S.own[l.id]='rv';bought.push(l);paintLot(l.id);paintBlock(l.blk)}
  return bought.length?`金牛地產買入 ${bought.map(lotName).join('、')}。`:''}
$('next').onclick=()=>{if(S.m>MONTHS)return;S.typhoon=false;S.skip=null;
  const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)]();
  const inc={me:0,rv:0};BUY.forEach(l=>{const w=S.own[l.id];if(!w||l.id===S.skip)return;inc[w]+=rentOf(l)});
  if(S.typhoon){inc.me/=2;inc.rv/=2}
  const interest=S.debt*rate;S.cash.me+=inc.me-interest;S.cash.rv+=inc.rv;AREAS.forEach(a=>S.rm[a]=1);
  const rv=rivalTurn();
  S.log.unshift(`第 ${S.m} 個月：${ev} 你收租 ${fmt(inc.me)}${interest?`，俾利息 ${fmt(interest)}`:''}。${rv}`);
  S.m++;
  if(S.m>MONTHS){S.m=MONTHS;hud();const a=worth('me'),b=worth('rv');
    $('endT').textContent=a>b?'你成為元朗地產大王，下一章：觀塘':'金牛地產贏咗今局';
    $('endP').textContent=`兩年後，你身家 ${fmt(a)}（已扣貸款），金牛地產 ${fmt(b)}。你擁有 ${owned('me').length} 個街區。`;$('end').hidden=false;S.m=MONTHS+1;return}
  hud()};
$('again').onclick=newGame;
addEventListener('resize',apply);
newGame();fit();
</script>
