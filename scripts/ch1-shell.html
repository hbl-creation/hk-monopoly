<!doctype html>
<html lang="zh-HK">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F3B33">
<title>香港地產大富翁 · 第一章 元朗（試玩版）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@600;900&family=Noto+Sans+HK:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 第一章試玩版版面（手機直版優先）
   視覺：銀行存摺同地契 —— 墨綠外框、黃銅字、淡綠賬簿紙、印泥紅圖章。
   地塊卡係一張地契：右上角蓋印（已購／待售／業主名），數字用襯線大字。
   結構：全屏地圖；頂部資料列（月份牌＋四個數）；底部分頁列＋「下個月」圖章；
   地塊卡同分頁內容係底部抽屜（電腦版喺左邊）；事件、月結、年報用置中卡片。 */
:root{
  --green:#0F3B33; --green2:#0A2A25; --ink:#13231F; --dim:#55635E; --line:rgba(15,59,51,.18);
  --paper:#F1F4E9; --panel:#FBFCF7; --rule:rgba(15,59,51,.09);
  --brass:#A8822B; --brass-lt:#E6CD86; --seal:#C8321F; --me:#D33F35; --up:#1D7F50; --dn:#B93A22;
  --display:"Noto Serif HK","Songti TC","PMingLiU",serif;
  --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif HK",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --dock:64px; --hud:78px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#4E5A63;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;background:#E7E3D6}
button{font:500 14px var(--body);color:var(--green);cursor:pointer;border:1.5px solid var(--green);background:var(--panel);border-radius:8px;padding:10px 14px}
button.primary{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:700;box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(255,255,255,.55)}
button:disabled{opacity:.4;cursor:not-allowed}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.dim{color:var(--dim)} .up{color:var(--up)} .dn{color:var(--dn)}
/* ── map ── */
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.drag{cursor:grabbing}
.blk{stroke:#CFC9B9;stroke-width:1.2;cursor:zoom-in}
.lot{stroke:#CFC9B9;stroke-width:1.2;cursor:pointer}
.bo{fill:none;stroke:#8F8775;stroke-width:1.6;pointer-events:none}
.lot.o-me{fill:#D33F35!important;stroke:#8E241D}
.lot.o-yc{fill:#2E5C9A!important;stroke:#173A6A}
.lot.o-kw{fill:#D98A1E!important;stroke:#8C5508}
.lot.o-sm{fill:#7DB5AE!important;stroke:#2F6F69}
.lot.o-sold{fill:#B9ADA3!important;stroke:#7D7268}
.lot.mg{stroke-width:2.6}
.lot.s-applied,.lot.s-cond,.lot.s-approved{stroke:#13231F;stroke-width:2.6;stroke-dasharray:6 4}
.lot.o-me.s-building{fill:url(#pb-me)!important} .lot.o-yc.s-building{fill:url(#pb-yc)!important}
.lot.o-me.s-done{fill:#8E1F18!important;stroke:#5A120D;stroke-width:2}
.lot.zn{stroke:#B78716;stroke-width:2;stroke-dasharray:4 3}
.lot.hl{stroke:#F2C14E;stroke-width:6}
.nm{font-family:var(--display);font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:.32em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ln{font-family:var(--body);font-weight:500;fill:#3B3426;paint-order:stroke;stroke:rgba(255,255,255,.92);stroke-width:.3em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rl{font-family:var(--body);font-weight:500;fill:#4A4232;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:.35em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.al{font-family:var(--display);font-weight:900;fill:rgba(15,59,51,.6);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.2em}
.rt{font-family:var(--body);font-weight:700;fill:#0F3B33;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:.34em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.rt.me{fill:#fff;stroke:#6E1711} .rt.ot{fill:#fff;stroke:rgba(19,35,31,.85)}
/* ── top bar：月份牌＋四個數；下面一行黃銅字講明係試玩版數值 ── */
#hud{position:absolute;left:0;right:0;top:0;z-index:20;color:#F3EFDD;background:var(--green);
  border-bottom:2px solid var(--brass);box-shadow:0 6px 20px rgba(6,24,21,.35);padding-top:var(--st)}
.hud-r{display:flex;align-items:stretch;gap:8px;padding:7px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
#menuBtn{background:transparent;border:1.5px solid rgba(230,205,134,.5);color:var(--brass-lt);padding:0;width:38px;font-size:17px;flex:none;border-radius:8px}
.cal{flex:none;width:46px;border-radius:6px;overflow:hidden;background:#FBFCF7;color:var(--ink);text-align:center;display:flex;flex-direction:column;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cal u{display:block;text-decoration:none;background:var(--seal);color:#fff;font-size:9.5px;line-height:15px;letter-spacing:.2em;padding-left:.2em}
.cal b{font-family:var(--display);font-weight:900;font-size:20px;line-height:21px;font-variant-numeric:tabular-nums}
.cal i{font-style:normal;font-size:8.5px;line-height:10px;color:var(--dim);padding-bottom:2px}
#lod{display:none}
.stats{flex:1;display:grid;grid-template-columns:1.2fr 1.5fr .75fr .75fr;min-width:0}
.stat{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 8px;border-left:1px solid rgba(230,205,134,.28)}
.stat:first-child{border-left:0;padding-left:2px}
.stat i{font-style:normal;font-size:10px;color:var(--brass-lt);white-space:nowrap;letter-spacing:.08em}
.stat b{font-family:var(--display);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.25}
.stat em{font-style:normal;font-size:10px;margin-left:3px;font-family:var(--body);font-weight:700}
.stat .up{color:#7FDCA6} .stat .dn{color:#FF9A85}
.stat:focus-visible{outline:2px solid var(--brass-lt);outline-offset:-2px;border-radius:4px}
#demoTag{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;background:var(--green2);color:var(--brass-lt);font-size:10.5px;line-height:18px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* ── tutorial note ── */
#coach{position:absolute;z-index:15;left:8px;right:8px;top:calc(var(--hud) + var(--st) + 8px);background:var(--panel);border:1.5px solid var(--brass);border-radius:10px;padding:9px 12px 10px;box-shadow:0 10px 26px rgba(6,24,21,.22)}
#coT{font-family:var(--display);font-weight:900;font-size:14px;color:var(--green)} #coD{font-size:12.5px;margin:2px 0 8px}
#coach .act{display:flex;gap:6px} #coach button{padding:6px 14px;font-size:13px}
/* ── zoom ── */
.zoom{position:absolute;z-index:10;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--dock) + var(--sb) + 26px);display:flex;flex-direction:column;border:1.5px solid var(--green);border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(6,24,21,.25)}
.zoom button{width:40px;height:40px;padding:0;font-size:18px;border:0;border-radius:0;border-top:1px solid var(--line)} .zoom button:first-child{border-top:0}
/* ── bottom dock ── */
#dock{position:absolute;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:stretch;gap:2px;height:calc(var(--dock) + var(--sb));
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + var(--sb)) max(6px,env(safe-area-inset-left,0px));background:var(--panel);border-top:2px solid var(--green);box-shadow:0 -6px 20px rgba(6,24,21,.16)}
#dock .tab{flex:1;min-width:0;border:0;background:transparent;border-radius:8px;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--dim);gap:2px}
#dock .tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#dock .tab.on{color:var(--green);font-weight:700;background:var(--paper);box-shadow:inset 0 -3px 0 var(--brass)}
#next{flex:none;margin-left:8px;padding:0 18px;border-radius:8px;background:var(--seal);border-color:var(--seal);color:#fff;font-family:var(--kai);font-weight:700;font-size:19px;letter-spacing:.12em;white-space:nowrap;
  box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3.5px rgba(255,255,255,.7),0 3px 0 #8C2114}
#next:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3.5px rgba(255,255,255,.7),0 1px 0 #8C2114}
/* ── sheets（底部抽屜）── */
.sheet{position:absolute;z-index:18;left:8px;right:8px;bottom:calc(var(--dock) + var(--sb) + 22px);max-height:min(60vh,calc(100% - var(--dock) - var(--sb) - var(--st) - var(--hud) - 34px));
  display:flex;flex-direction:column;background:var(--panel);border:1.5px solid var(--green);border-radius:12px;box-shadow:0 16px 44px rgba(6,24,21,.38);overflow:hidden}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 8px 16px;background:var(--green);color:#F3EFDD}
.sh-h b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.06em}
.x{border:0;background:transparent;font-size:17px;padding:6px 11px;border-radius:8px;color:inherit}
.sh-b{padding:12px 14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper)}
/* 地契 */
#deed{--c:var(--brass)}
.deed-h{position:relative;padding:12px 104px 10px 16px;background:var(--panel);border-top:7px solid var(--c);border-bottom:1px solid var(--line)}
.deed-h .x{position:absolute;right:2px;top:2px;color:var(--dim)}
.deed-h .tag{font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.deed-h .st{font-family:var(--display);font-weight:900;font-size:21px;line-height:1.25;color:var(--ink)}
.deed-h .sub{font-size:12px;color:var(--dim)}
.seal{position:absolute;right:42px;top:12px;width:50px;height:50px;display:grid;place-items:center;border:2.5px solid var(--c);border-radius:6px;color:var(--c);
  font-family:var(--kai);font-weight:700;font-size:19px;line-height:1;letter-spacing:.04em;transform:rotate(-7deg);box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px var(--c);opacity:.92}
.deed-b{padding:12px 16px 14px;overflow:auto;background:var(--panel)}
.deed-b>.row{border-bottom:1px dotted var(--line)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.figs div{padding:7px 10px 8px;border-left:1px solid var(--line);min-width:0} .figs div:first-child{border-left:0}
.figs i{display:block;font-style:normal;font-size:11px;color:var(--dim)}
.figs b{display:block;font-family:var(--display);font-weight:900;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.figs small{display:block;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;gap:12px;line-height:28px;font-variant-numeric:tabular-nums}
.row span{color:var(--dim)} .row b{font-weight:700;text-align:right}
.note{margin-top:6px;font-size:12.5px;line-height:1.6;color:var(--dim);background:var(--panel)}
.status{margin:6px 0;padding:8px 10px;border-left:4px solid var(--brass);background:#F6EFD6;font-size:13px;border-radius:0 6px 6px 0}
.status.ok{border-color:var(--up);background:#DFF0E4}
.act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap} .act button{flex:1 1 auto}
/* 賬簿方格 */
.box{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 10px;background:var(--panel)}
.box .row{border-top:1px dotted var(--line)} .box .row:first-child,.box .mh+.row{border-top:0}
.box p{margin:6px 0 0;font-size:12.5px}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px} .mh b{font-family:var(--display);font-size:16px}
.meter{position:relative;height:10px;border-radius:2px;background:#DCE2D0;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0} .meter u{position:absolute;top:0;bottom:0;width:2px;background:rgba(15,59,51,.45)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;color:var(--ink)}
.item small{grid-column:1/3;color:var(--dim);font-size:12px}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:#E2E8D6;white-space:nowrap;align-self:center;color:var(--green)}
.chip.c-applied,.chip.c-cond{background:#F4E3A6;color:#5E4300} .chip.c-approved{background:#CDEBD8} .chip.c-building{background:#F6CFC8;color:#7A1A10} .chip.c-done{background:#8E1F18;color:#fff}
h3{font-family:var(--display);font-weight:900;font-size:15px;margin:16px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--green);color:var(--green)}
.lg{margin:0 0 7px;font-size:13px}
.rcard{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline} .rh b{font-family:var(--display);font-size:18px} .rh span{font-size:11px;color:var(--dim)}
.rcard p{margin:4px 0 8px;font-size:12.5px}
.attr{display:grid;grid-template-columns:38px 1fr 18px;gap:8px;align-items:center;font-size:12px;margin:2px 0}
.attr div{height:7px;background:#DCE2D0;overflow:hidden} .attr i{display:block;height:100%;background:var(--c)} .attr b{text-align:right}
.lnk{border:0;background:transparent;padding:6px 0 0;color:var(--seal);font-weight:700}
.rank{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.rk{display:grid;grid-template-columns:22px 1fr auto 46px;gap:8px;align-items:center;padding:7px 10px;border-top:1px dotted var(--line);font-variant-numeric:tabular-nums}
.rk:first-child{border-top:0} .rk i{font-style:normal;font-family:var(--display);font-weight:900;color:var(--brass)}
.rk b small{display:block;font-weight:400;font-size:10.5px;color:var(--dim)} .rk em{font-style:normal;font-size:11px;text-align:right;color:var(--dim)}
.rk em.up{color:var(--up)} .rk em.dn{color:var(--dn)}
.rk.big{background:#E9EDDF;color:var(--dim)} .rk.me{background:#FBE7E3;box-shadow:inset 4px 0 0 var(--seal)} .rk.me b{color:var(--seal)}
/* ── toast ── */
#toast{position:absolute;z-index:60;left:50%;transform:translateX(-50%);top:calc(var(--st) + var(--hud) + 10px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;border-left:4px solid var(--brass);font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:88%;text-align:center;pointer-events:none}
/* ── modal ── */
#modal{position:absolute;inset:0;z-index:50;background:rgba(6,24,21,.66);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--st)) 12px calc(12px + var(--sb))}
.mcard{width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--green);border-radius:12px;box-shadow:0 26px 70px rgba(0,0,0,.5);overflow:hidden}
#mB{padding:0 18px 6px;overflow:auto;-webkit-overflow-scrolling:touch}
.mk{position:sticky;top:0;z-index:1;margin:0 -18px 14px;padding:7px 18px;background:var(--green);color:var(--brass-lt);font-size:12px;letter-spacing:.12em;border-bottom:2px solid var(--brass)}
#mB h2{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.25;margin:0 0 10px;color:var(--ink)}
#mB>h2:first-child{margin-top:18px}
#mB p{margin:0 0 10px}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px 16px;background:var(--paper)}
.mbtns button{flex:1 1 40%;padding:12px 10px} .mbtns button small{display:block;font-weight:400;font-size:11px;opacity:.85}
#modal.menu .mbtns button,#modal.event .mbtns button{flex:1 1 100%}
#modal.story .mcard{background:var(--green);color:#F3EFDD;border-color:var(--brass)} #modal.story .mk{background:transparent;border:0;margin-bottom:6px;padding-top:16px}
#modal.story #mB h2{color:var(--brass-lt);font-size:28px} #modal.story #mB p{font-family:var(--kai);font-size:18px;line-height:1.85}
#modal.story .mbtns{background:var(--green)} #modal.story .mbtns button:not(.primary){background:transparent;color:#F3EFDD;border-color:rgba(230,205,134,.5)}
#modal.event #mB p{font-family:var(--kai);font-size:17px;line-height:1.8} #modal.event #mB h2{font-size:26px}
.fx{margin:4px 0 8px;padding:9px 12px;border-left:4px solid var(--brass);background:var(--panel);border-radius:0 6px 6px 0;font-size:13.5px;font-weight:500}
#modal.report .mcard{width:min(560px,100%)} #modal.report #mB h2{font-size:32px;letter-spacing:.04em}
.lead{font-family:var(--kai);font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.kpis div{padding:8px 10px;border-left:1px solid var(--line)} .kpis div:first-child{border-left:0}
.kpis i{display:block;font-style:normal;font-size:11px;color:var(--dim)} .kpis b{font-family:var(--display);font-weight:900;font-size:20px;white-space:nowrap}
.chk{padding:7px 10px;border-radius:6px;margin-bottom:6px;font-size:13px;font-weight:500} .chk.y{background:#DDF1E5;color:#135C38} .chk.n{background:#FBE1DC;color:#8A2A1B}
.quote{font-family:var(--kai);font-size:18px;border-left:4px solid var(--green);padding-left:12px}
.opts,.plans{display:grid;gap:8px;margin:8px 0}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink)}
.opt>b{font-family:var(--display);font-size:16px}
.opt small{grid-column:1/3;font-size:12px;color:var(--dim)} .opt small b{color:var(--ink)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:#E2E8D6;white-space:nowrap;align-self:center;color:var(--green)}
.opt.on,.plan.on{border:2px solid var(--seal);background:#FFF6F3;padding:9px 11px}
.plans{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.plan{text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)} .plan small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.lgds{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-bottom:10px} .lgd{display:flex;align-items:center;gap:8px;font-size:13px}
.lgd i{width:18px;height:18px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.14)}
/* ── map editor (scripts/editor.js) inside this shell ── */
body #edBtn{display:none}
body.editing #edBtn{display:block;top:auto;right:12px;bottom:calc(16px + var(--sb));z-index:45}
body.editing #hud,body.editing #dock,body.editing #coach,body.editing .sheet,body.editing .zoom{display:none!important}
body #attrib{right:auto;left:8px;bottom:calc(var(--dock) + var(--sb) + 4px);font-size:9px;max-width:calc(100% - 16px);z-index:5}
body.mo #attrib,body.editing #attrib{display:none}
/* ── desktop ── */
@media (min-width:900px){
  :root{--dock:68px}
  #hud{left:16px;right:auto;top:14px;width:520px;border:2px solid var(--brass);border-radius:12px;overflow:hidden;padding-top:0}
  #coach{left:16px;right:auto;width:400px;top:112px}
  .sheet{left:16px;right:auto;width:420px;bottom:calc(var(--dock) + 28px);max-height:calc(100% - var(--dock) - 250px)}
  #dock{left:16px;right:auto;bottom:14px;width:520px;border:2px solid var(--green);border-radius:12px;height:var(--dock)}
  #dock .tab{flex-direction:row;gap:6px;font-size:13px} #dock .tab svg{width:20px;height:20px}
  .zoom{right:20px;bottom:36px} #toast{top:116px}
  body #attrib{left:auto;right:76px;bottom:8px;max-width:none;font-size:10px}
  .lot:hover{stroke:#13231F;stroke-width:2.4} .blk:hover{stroke:#6E6757;stroke-width:3}
}
@media (max-width:360px){.stat b{font-size:15px}.stat{padding:0 5px}#next{padding:0 12px;font-size:17px}.cal{width:40px}}
@media (prefers-reduced-motion:no-preference){
  .lot,.blk{transition:fill .25s}
  .sheet{animation:up .18s ease-out} .mcard{animation:pop .2s ease-out} .seal{animation:stamp .28s cubic-bezier(.2,1.6,.4,1)}
  @keyframes up{from{transform:translateY(16px);opacity:0}}
  @keyframes pop{from{transform:scale(.96);opacity:0}}
  @keyframes stamp{from{transform:rotate(-7deg) scale(1.7);opacity:0}}
}
