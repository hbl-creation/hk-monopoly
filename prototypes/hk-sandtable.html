<title>香港十八區沙盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@700;900&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen night-harbour sandtable; map fills the screen, controls float at the edges like a war-room table */
:root{
  --sea:#0E1B2C; --sea-2:#152740; --ink:#EDE7D9; --ink-dim:#A8B3C2;
  --panel:rgba(12,22,36,.82); --line:rgba(237,231,217,.16); --red:#E0473F;
  --display:"Noto Serif HK","Songti TC",serif; --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c.px{image-rendering:pixelated}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;
  padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
h1{font-family:var(--display);font-weight:900;font-size:clamp(20px,3.4vw,30px);letter-spacing:.04em;margin:0;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:12px;letter-spacing:.12em;color:var(--ink-dim);margin-top:6px}
.score{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.score b{color:var(--red);font-size:18px;font-weight:700;margin-right:2px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.tip{pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;min-height:20px;max-width:100%;color:var(--ink)}
.tip .d{color:var(--ink-dim);margin-right:6px}
.btns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
button{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
button:hover{border-color:rgba(237,231,217,.45)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--sea)}
.lbl{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);will-change:transform}
.lbl.dist{font-family:var(--display);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.5);letter-spacing:.06em}
.lbl.peak{font-size:11px;color:#F3EBD3;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.lbl.peak::before{content:"▲ ";font-size:9px;color:#C9B98E}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim);font-size:14px}
@media (max-width:560px){.lbl.dist{font-size:11px}.lbl.peak{display:none}}
</style>
<div id="app">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="loading">正在砌地形…</div>
  <div class="top">
    <h1>香港十八區沙盤<small>18 區 · 89 個地區 · 撳一下佔領</small></h1>
    <div class="score" aria-live="polite"><b id="cnt">0</b>/ 89 已佔領</div>
  </div>
  <div class="bar">
    <div class="tip" id="tip">拖動旋轉，雙指或滾輪縮放；撳任何地區佔領</div>
    <div class="btns">
      <span class="seg" role="group" aria-label="地形風格">
        <button data-style="voxel" aria-pressed="true">方塊</button>
        <button data-style="poly" aria-pressed="false">低多邊形</button>
        <button data-style="smooth" aria-pressed="false">平滑地形</button>
      </span>
      <button id="pix" aria-pressed="false">像素化</button>
      <button id="reset">重設</button>
    </div>
  </div>
</div>

  for(const p of pk){const dx=x-p.cx,dy=y-p.cy,d2=dx*dx+dy*dy;if(d2<p.s*p.s*16)m+=p.h*Math.exp(-d2/(2*p.s*p.s))}
  h+=m*Math.min(1,dist[i]/2.5)+(dist[i]>3?hash(x,y)*0.35:0);hgt[i]=Math.max(0.5,Math.round(h*2)/2)}
// colours
const distCol=D.districts.map((_,k)=>new THREE.Color().setHSL(((k*137.508)%360)/360,0.38,0.56));
const RED=new THREE.Color(0xE0473F),ROCK=new THREE.Color(0x9C9886);
const captured=new Set();
const cells=[];for(let i=0;i<W*H;i++)if(grid[i]>=0)cells.push(i);
const inst=new Int32Array(W*H).fill(-1);cells.forEach((c,k)=>inst[c]=k);
function shadeOf(i){const s=grid[i],x=i%W,y=(i/W)|0;let border=1;
  for(const j of [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1]){if(j<0||grid[j]<0)continue;if(subDist[grid[j]]!==subDist[s])border=Math.min(border,0.55);else if(grid[j]!==s)border=Math.min(border,0.8)}
  return border}
const tmp=new THREE.Color();
function colorCell(i,hl){const s=grid[i];
  if(captured.has(s)){tmp.copy(RED)}else{tmp.copy(distCol[subDist[s]]);tmp.offsetHSL(0,0,(s%2?0.045:-0.035));const h=hgt[i];if(h>4)tmp.lerp(ROCK,Math.min(0.45,(h-4)/10))}
  tmp.multiplyScalar(shadeOf(i));if(hl)tmp.lerp(new THREE.Color(0xffffff),0.35);return tmp}
// three
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setClearColor(0x0E1B2C);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0E1B2C,180,330);
const camera=new THREE.PerspectiveCamera(38,1,0.5,800);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.maxPolarAngle=1.3;controls.minDistance=25;controls.maxDistance=260;controls.target.set(0,0,4);
scene.add(new THREE.HemisphereLight(0xE6EEFF,0x2A2418,0.8));
const sun=new THREE.DirectionalLight(0xFFF0D8,1.0);sun.position.set(-70,110,50);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-120,right:120,top:90,bottom:-90,near:10,far:320});sun.shadow.bias=-0.0006;scene.add(sun);
const geo=new THREE.BoxGeometry(1,1,1);geo.translate(0,0.5,0);
const land=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({roughness:0.9,flatShading:true}),cells.length);
land.castShadow=land.receiveShadow=true;
const m4=new THREE.Matrix4();
cells.forEach((i,k)=>{const x=i%W,y=(i/W)|0;m4.makeScale(1,hgt[i],1);m4.setPosition(x-W/2+0.5,0,y-H/2+0.5);land.setMatrixAt(k,m4);land.setColorAt(k,colorCell(i,false))});
scene.add(land);
const SEA=new THREE.Color(0x1C3554);
const meshes={};
function buildTerrain(smooth){
  let hh=new Float32Array(W*H);for(let i=0;i<W*H;i++)hh[i]=grid[i]<0?-0.9:hgt[i]+(smooth?0:(hash(i%W,(i/W)|0)-0.5)*0.35);
  if(smooth){for(let pass=0;pass<3;pass++){const n=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0,c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=W||Y>=H)continue;s+=hh[Y*W+X];c++}n[y*W+x]=s/c}hh=n}
    for(let i=0;i<W*H;i++)if(grid[i]>=0)hh[i]=Math.max(hh[i],0.55)}
  const g=new THREE.PlaneGeometry(W-1,H-1,W-1,H-1);g.rotateX(-Math.PI/2);
  const pos=g.attributes.position.array;for(let k=0;k<W*H;k++)pos[k*3+1]=hh[k];
  const col=new Float32Array(W*H*3);g.setAttribute('color',new THREE.BufferAttribute(col,3));
  for(let i=0;i<W*H;i++){const c=grid[i]<0?SEA:colorCell(i,false);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:!smooth,roughness:smooth?0.75:0.95}));
  m.castShadow=m.receiveShadow=true;m.visible=false;scene.add(m);return m}
let style='voxel';
function activeObj(){return style==='voxel'?land:meshes[style]}
function setStyle(s){style=s;if(s!=='voxel'&&!meshes[s])meshes[s]=buildTerrain(s==='smooth');
  land.visible=s==='voxel';for(const k in meshes)meshes[k].visible=k===s;
  document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===s))}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>setStyle(b.dataset.style));
const wg=new THREE.PlaneGeometry(W+160,H+160,140,110);wg.rotateX(-Math.PI/2);
const wpos=wg.attributes.position,wbase=Float32Array.from(wpos.array);
const water=new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:0x24507F,roughness:0.35,metalness:0.15,flatShading:true,transparent:true,opacity:0.94}));
water.position.y=0.35;water.receiveShadow=true;scene.add(water);
// labels
const labelsEl=document.getElementById('labels'),labels=[];
function addLabel(text,cls,x,y,z){const el=document.createElement('div');el.className='lbl '+cls;el.textContent=text;labelsEl.appendChild(el);labels.push({el,v:new THREE.Vector3(x,y,z)})}
D.districts.forEach((d,k)=>{let sx=0,sy=0,n=0,mh=0;cells.forEach(i=>{if(subDist[grid[i]]===k){sx+=i%W;sy+=(i/W)|0;n++;mh=Math.max(mh,hgt[i])}});
  let bx=sx/n,by=sy/n,best=null,bd=1e9;cells.forEach(i=>{if(subDist[grid[i]]!==k)return;const d=(i%W-bx)**2+(((i/W)|0)-by)**2;if(d<bd){bd=d;best=i}});
  addLabel(d[0],'dist',best%W-W/2+0.5,hgt[best]+2.2,((best/W)|0)-H/2+0.5)});
["大帽山","獅子山","太平山","鳳凰山","馬鞍山","八仙嶺"].forEach(n=>{const p=pk.find(o=>o.n===n);const i=Math.round(p.cy)*W+Math.round(p.cx);addLabel(n,'peak',p.cx-W/2+0.5,(hgt[i]||2)+1.2,p.cy-H/2+0.5)});
// interaction
const tip=document.getElementById('tip'),cnt=document.getElementById('cnt');
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let hoverSub=-1,down=null;
function pick(e){const r=canvas.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
  const h=ray.intersectObject(activeObj())[0];if(!h)return -1;if(style==='voxel')return cells[h.instanceId];
  const cx=Math.round(h.point.x+(W-1)/2),cy=Math.round(h.point.z+(H-1)/2);let best=-1,bd=9;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=cx+dx,Y=cy+dy;if(X<0||Y<0||X>=W||Y>=H)continue;const i=Y*W+X;if(grid[i]>=0&&dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;best=i}}return best}
function paintCell(i,k,hl){const c=colorCell(i,hl);land.setColorAt(k,c);for(const key in meshes){const a=meshes[key].geometry.attributes.color.array;a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b}}
function flush(){land.instanceColor.needsUpdate=true;for(const key in meshes)meshes[key].geometry.attributes.color.needsUpdate=true}
function paintSub(s,hl){if(s<0)return;cells.forEach((i,k)=>{if(grid[i]===s)paintCell(i,k,hl)});flush()}
function describe(s){const d=D.districts[subDist[s]][0];return `<span class="d">${d}</span>${D.subs[s][1]}${captured.has(s)?' · 已佔領':''}`}
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const c=pick(e),s=c<0?-1:grid[c];if(s!==hoverSub){paintSub(hoverSub,false);hoverSub=s;paintSub(s,true)}if(s>=0)tip.innerHTML=describe(s)});
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const c=pick(e);if(c<0)return;const s=grid[c];
  captured.has(s)?captured.delete(s):captured.add(s);paintSub(s,e.pointerType==='mouse');cnt.textContent=captured.size;tip.innerHTML=describe(s)});
document.getElementById('reset').onclick=()=>{captured.clear();cells.forEach((i,k)=>paintCell(i,k,false));flush();cnt.textContent=0;tip.textContent='已重設，撳任何地區佔領'};
let pixel=false;const pixBtn=document.getElementById('pix');
pixBtn.onclick=()=>{pixel=!pixel;pixBtn.setAttribute('aria-pressed',pixel);canvas.classList.toggle('px',pixel);resize()};
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
  renderer.setPixelRatio(pixel?0.33:Math.min(devicePixelRatio||1,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
const aspect0=canvas.clientWidth/Math.max(1,canvas.clientHeight),far=aspect0<1?1.9/Math.max(aspect0,0.5):1;
camera.position.set(0,105*far,92*far);
addEventListener('resize',resize);resize();
document.getElementById('loading').remove();
const v=new THREE.Vector3(),clock=new THREE.Clock();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();
  if(!reduce){const a=wpos.array;for(let k=0;k<a.length;k+=3){a[k+1]=Math.sin(t*1.3+wbase[k]*0.22+wbase[k+2]*0.17)*0.18+Math.sin(t*0.7-wbase[k]*0.09)*0.1}wpos.needsUpdate=true}
  controls.update();renderer.render(scene,camera);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  for(const L of labels){v.copy(L.v).project(camera);const on=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05;L.el.style.display=on?'':'none';if(on)L.el.style.transform=`translate(${(v.x+1)/2*w}px,${(1-v.y)/2*h}px) translate(-50%,-100%)`}}
frame();
</script>
