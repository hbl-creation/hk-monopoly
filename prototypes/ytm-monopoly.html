<title>油尖旺大富翁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@700;900&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen street-directory map (yellow trunk roads, white side streets); HUD floats top, title-deed card + month button float bottom */
:root{
  --sea:#BCD7E3; --land:#E9E6DD; --block:#FBFAF6; --road-major:#F2C14E; --road-case:#B78716; --road-mid:#F8E3A1; --road-minor:#FFFFFF; --road-minor-case:#C9C4B6;
  --ink:#1D2530; --dim:#5E6672; --line:rgba(29,37,48,.14); --panel:#FFFFFF;
  --me:#D33F35; --me-soft:#F3C3BD; --rival:#2E5C9A; --rival-soft:#C2D3EA; --gold:#B78716;
  --display:"Noto Serif HK","Songti TC",serif; --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.drag{cursor:grabbing}
.blk{stroke:#D8D3C5;stroke-width:1.2;cursor:pointer}
.blk:hover{stroke:#8E8774;stroke-width:3}
.blk.me{fill:var(--me);stroke:#8E241D}
.blk.rv{fill:var(--rival);stroke:#173A6A}
.blk.sel{stroke:var(--ink)!important;stroke-width:6!important}
.lm{font-family:var(--display);font-weight:900;fill:#7A4E00;paint-order:stroke;stroke:#fff;stroke-width:.32em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rl{font-family:var(--body);font-weight:500;fill:#4A4232;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:.35em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.al{font-family:var(--display);font-weight:900;fill:rgba(29,37,48,.55);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.2em}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(29,37,48,.16)}
.brand{padding:10px 14px}
h1{font-family:var(--display);font-weight:900;font-size:21px;margin:0;letter-spacing:.06em}
.month{font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pl{padding:8px 12px;display:grid;grid-template-columns:auto auto;column-gap:10px;row-gap:1px;align-items:baseline;font-variant-numeric:tabular-nums}
.pl .nm{grid-column:1/3;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.pl .nm i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pl .k{font-size:11px;color:var(--dim)} .pl .v{font-size:15px;font-weight:700;text-align:right}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deed{width:min(330px,100%);overflow:hidden}
.deed-h{padding:10px 14px 9px;color:#fff;background:var(--gold)}
.deed-h .area{font-size:11px;letter-spacing:.2em;opacity:.9}
.deed-h .st{font-family:var(--display);font-weight:900;font-size:19px;line-height:1.25;text-wrap:balance}
.deed-h .poi{font-size:12px;margin-top:2px}
.deed-b{padding:10px 14px 12px;display:grid;gap:4px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--dim)} .row b{font-weight:700}
.owner{margin-top:4px;font-size:12px;color:var(--dim)}
.act{display:flex;gap:8px;margin-top:8px}
button{font:500 14px var(--body);border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button.primary{background:var(--me);border-color:var(--me);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;min-width:0}
.log{padding:9px 12px;font-size:12.5px;max-width:330px;display:grid;gap:4px}
.log div{line-height:1.5} .log .new{font-weight:700;color:var(--ink)} .log .old{color:var(--dim)}
.next{pointer-events:auto;font-family:var(--display);font-weight:900;font-size:17px;padding:12px 22px;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 28px rgba(29,37,48,.28)}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;padding:0;font-size:18px;box-shadow:0 4px 14px rgba(29,37,48,.15)}
#end{position:absolute;inset:0;background:rgba(29,37,48,.55);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#end .card{padding:22px;max-width:360px;text-align:center}
#end h2{font-family:var(--display);font-weight:900;font-size:26px;margin:0 0 8px}
#end p{margin:0 0 14px;color:var(--dim);line-height:1.6}
@media (max-width:620px){
  .deed{width:100%} .right{width:100%;flex-direction:row;align-items:flex-end;justify-content:space-between} .log{max-width:none;flex:1;min-width:0}
  .zoom{top:auto;bottom:auto;top:40%} h1{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.blk{transition:fill .25s}}
</style>
<div id="app">
  <svg id="map" role="img" aria-label="油尖旺街道地圖，每個街區可以買入"></svg>
  <div class="top">
    <div class="card brand"><h1>油尖旺大富翁</h1><div class="month" id="month"></div></div>
    <div class="players">
      <div class="card pl"><div class="nm"><i style="background:var(--me)"></i>你</div><span class="k">現金</span><span class="v" id="meCash"></span><span class="k">身家</span><span class="v" id="meWorth"></span></div>
      <div class="card pl"><div class="nm"><i style="background:var(--rival)"></i>金牛地產</div><span class="k">現金</span><span class="v" id="rvCash"></span><span class="k">身家</span><span class="v" id="rvWorth"></span></div>
    </div>
  </div>
  <div class="zoom"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="fit" aria-label="睇全區" style="font-size:12px">全區</button></div>
  <div class="bottom">
    <div class="card deed" id="deed" hidden>
      <div class="deed-h" id="dh"><div class="area" id="dArea"></div><div class="st" id="dSt"></div><div class="poi" id="dPoi"></div></div>
      <div class="deed-b">
        <div class="row"><span>佔地</span><b id="dM2"></b></div>
        <div class="row"><span>市值</span><b id="dPrice"></b></div>
        <div class="row"><span>每月租金</span><b id="dRent"></b></div>
        <div class="owner" id="dOwner"></div>
        <div class="act"><button class="primary" id="buy"></button><button id="close">收起</button></div>
      </div>
    </div>
    <div class="right">
      <div class="card log" id="log" aria-live="polite"></div>
      <button class="next" id="next">下個月 ›</button>
    </div>
  </div>
  <div id="end" hidden><div class="card"><h2 id="endT"></h2><p id="endP"></p><button class="primary" id="again">再玩一局</button></div></div>
</div>

const rentOf=b=>{const who=S.own[b.id];let r=price(b)*(b.r/b.p)*S.rm[b.a];if(who&&leader(who,b.a))r*=1.5;return r};
const worth=who=>S.cash[who]+owners(who).reduce((s,b)=>s+price(b),0);
function newGame(){S={m:1,cash:{me:START,rv:START},own:{},pm:{},rm:{},sel:null,log:[]};AREAS.forEach(a=>{S.pm[a]=1;S.rm[a]=1});
  const pick=['大角咀','太子','油麻地'];for(const a of pick){const c=M.blocks.filter(b=>b.a===a&&b.p<25);for(let i=0;i<3;i++){const b=c[Math.floor(Math.random()*c.length)];if(!S.own[b.id]&&S.cash.rv>=b.p){S.own[b.id]='rv';S.cash.rv-=b.p}}}
  S.log=['你帶住 150 億入場。撳街區睇樓契，買入收租；對手金牛地產已經喺大角咀、太子同油麻地買咗幾個街區。'];
  document.getElementById('end').hidden=true;paintAll();const first=M.blocks.find(b=>b.poi==='西洋菜街行人專用區')||M.blocks[0];select(first.id);hud()}
function paint(id){const e=bEl[id];e.classList.toggle('me',S.own[id]==='me');e.classList.toggle('rv',S.own[id]==='rv');e.classList.toggle('sel',S.sel===id)}
function paintAll(){M.blocks.forEach(b=>paint(b.id))}
function hud(){document.getElementById('month').textContent=`第 ${S.m} 個月 / 共 ${MONTHS} 個月`;
  meCash.textContent=fmt(S.cash.me);rvCash.textContent=fmt(S.cash.rv);meWorth.textContent=fmt(worth('me'));rvWorth.textContent=fmt(worth('rv'));
  document.getElementById('log').innerHTML=S.log.slice(0,3).map((t,i)=>`<div class="${i?'old':'new'}">${t}</div>`).join('');renderDeed()}
function select(id){const prev=S.sel;S.sel=id;gSel.setAttribute('points',pts(M.blocks[id].g));if(prev!==null)paint(prev);paint(id);document.getElementById('deed').hidden=false;renderDeed()}
function renderDeed(){if(S.sel===null)return;const b=M.blocks[S.sel],who=S.own[b.id],p=price(b);
  dArea.textContent=b.a+'區';dSt.textContent=b.s.slice(0,2).join(' × ')||'無名街區';dPoi.textContent=b.poi?'★ '+b.poi:'';dPoi.hidden=!b.poi;
  document.getElementById('dh').style.background=who==='me'?'var(--me)':who==='rv'?'var(--rival)':'var(--gold)';
  dM2.textContent=b.m2.toLocaleString('zh-HK')+' 平方米';dPrice.textContent=fmt(p);dRent.textContent=fmt(rentOf(b));
  const lead=who&&leader(who,b.a)?'，佢係'+b.a+'地區龍頭，租金 ×1.5':'';
  const mine=owners('me',b.a).length;
  dOwner.textContent=(who==='me'?'你嘅物業'+lead:who==='rv'?'金牛地產物業'+lead:'未有業主')+` · 你喺${b.a}有 ${mine}/${areaCount[b.a]} 個街區`;
  const btn=document.getElementById('buy');
  if(!who){btn.textContent='買入 '+fmt(p);btn.disabled=S.cash.me<p;btn.hidden=false}
  else if(who==='rv'){const c=p*1.5;btn.textContent='收購 '+fmt(c);btn.disabled=S.cash.me<c;btn.hidden=false}
  else btn.hidden=true}
document.getElementById('buy').onclick=()=>{const b=M.blocks[S.sel],who=S.own[b.id],p=price(b);
  if(!who&&S.cash.me>=p){S.cash.me-=p;S.own[b.id]='me';S.log.unshift(`你買入${b.a}「${b.s.slice(0,2).join(' × ')}」，用咗 ${fmt(p)}。`)}
  else if(who==='rv'&&S.cash.me>=p*1.5){S.cash.me-=p*1.5;S.cash.rv+=p*1.5;S.own[b.id]='me';S.log.unshift(`你以 ${fmt(p*1.5)} 由金牛地產手上收購咗${b.poi||b.s[0]+'街區'}。`)}
  paint(b.id);hud()};
document.getElementById('close').onclick=()=>{const p=S.sel;S.sel=null;gSel.setAttribute('points','');if(p!==null)paint(p);document.getElementById('deed').hidden=true};
const EVENTS=[
  ()=>{const a=pickA();S.pm[a]*=1.15;return `政府公布${a}重建計劃，${a}樓價升 15%。`},
  ()=>{const a=pickA();S.pm[a]*=0.9;return `${a}有大型新盤推出，二手樓價跌 10%。`},
  ()=>{AREAS.forEach(a=>S.pm[a]*=0.95);return '銀行加息 0.25 厘，全區樓價跌 5%。'},
  ()=>{AREAS.forEach(a=>S.pm[a]*=1.06);return '樓市氣氛好轉，全區樓價升 6%。'},
  ()=>{S.rm['尖沙咀']*=1.25;S.rm['尖東']*=1.25;return '旅客回流，尖沙咀同尖東租金升 25%，維持一個月。'},
  ()=>{S.typhoon=true;return '八號風球襲港，今個月所有租金收入減半。'},
  ()=>{S.rm['旺角']*=1.3;return '網紅掃街熱潮，旺角租金升 30%，維持一個月。'},
  ()=>{const mine=owners('me');if(!mine.length)return '今個月風平浪靜。';const b=mine[Math.floor(Math.random()*mine.length)];S.skip=b.id;return `租客走數，${b.poi||b.s[0]+'街區'}今個月收唔到租。`},
];
function pickA(){const main=['尖沙咀','旺角','佐敦','油麻地','太子','大角咀'];return main[Math.floor(Math.random()*main.length)]}
function rivalTurn(){const mine=new Set(owners('rv').map(b=>b.a));let bought=[];
  for(let k=0;k<2;k++){const reserve=20,c=M.blocks.filter(b=>!S.own[b.id]&&price(b)<=S.cash.rv-reserve);if(!c.length)break;
    c.sort((a,b)=>((mine.has(b.a)?1.6:1)*b.r/b.p)-((mine.has(a.a)?1.6:1)*a.r/a.p)+(Math.random()-.5)*0.02);const b=c[Math.floor(Math.random()*Math.min(6,c.length))];
    S.cash.rv-=price(b);S.own[b.id]='rv';bought.push(b);paint(b.id)}
  return bought.length?`金牛地產買入 ${bought.map(b=>b.poi||b.a+b.s[0]).join('、')}。`:''}
document.getElementById('next').onclick=()=>{if(S.m>MONTHS)return;S.typhoon=false;S.skip=null;
  const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)]();
  const inc={me:0,rv:0};M.blocks.forEach(b=>{const w=S.own[b.id];if(!w||b.id===S.skip)return;inc[w]+=rentOf(b)});
  if(S.typhoon){inc.me/=2;inc.rv/=2}
  S.cash.me+=inc.me;S.cash.rv+=inc.rv;
  AREAS.forEach(a=>S.rm[a]=1);
  const rv=rivalTurn();
  S.log.unshift(`第 ${S.m} 個月：${ev} 你收租 ${fmt(inc.me)}。${rv}`);
  S.m++;
  if(S.m>MONTHS){S.m=MONTHS;hud();const a=worth('me'),b=worth('rv');
    endT.textContent=a>b?'你成為油尖旺地產大亨':'金牛地產贏咗今局';
    endP.textContent=`兩年後，你身家 ${fmt(a)}，金牛地產 ${fmt(b)}。你擁有 ${owners('me').length} 個街區。`;document.getElementById('end').hidden=false;S.m=MONTHS+1;return}
  hud()};
document.getElementById('again').onclick=newGame;
addEventListener('resize',apply);
fit();newGame();
</script>
