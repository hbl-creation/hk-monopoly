<title>香港十八區棋盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@700;900&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/* Layout: a board-game map of Hong Kong filling the screen; title and score float top, controls float bottom, like pieces on a table */
:root{
  --sea:#1E4A5A; --wave:#2A5D6E; --shadow:#123542; --border:#10242C;
  --panel:#F3F5F2; --ink:#16252C; --dim:#5A6B72; --red:#D23B33; --line:rgba(22,37,44,.16);
  --display:"Noto Serif HK","Songti TC",serif; --body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:relative;height:100%}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.sub{stroke:#fff;stroke-opacity:.75;stroke-width:.6;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.sub:hover{filter:brightness(1.12)}
.sub.own{fill:var(--red)!important}
.dist{fill:none;stroke:var(--border);stroke-width:1.6;stroke-linejoin:round;pointer-events:none}
.shadow{fill:var(--shadow);pointer-events:none}
.dl{font-family:var(--display);font-weight:900;fill:#0F1E24;paint-order:stroke;stroke:#fff;stroke-width:.25em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.05em}
.sl{font-family:var(--body);font-weight:500;fill:#1C2B31;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:.3em;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sea-l{font-family:var(--display);font-weight:700;fill:#8FB8C2;font-style:italic;letter-spacing:.3em;text-anchor:middle;pointer-events:none}
.scale text{font-family:var(--body);fill:#CFE1E6}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
h1{font-family:var(--display);font-weight:900;font-size:20px;margin:0;letter-spacing:.05em;text-wrap:balance}
.hint{font-size:12px;color:var(--dim);margin-top:3px}
.score{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.score b{color:var(--red);font-size:20px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#info{pointer-events:none;font-size:13px;min-width:0}
#info .d{color:var(--dim);margin-right:6px}
.btns{display:flex;gap:6px;pointer-events:auto}
button{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<div id="wrap">
  <svg id="map" role="img" aria-label="香港十八區地圖，分成 89 個可佔領地區"></svg>
  <div class="hud">
    <div class="card"><h1>香港十八區棋盤</h1><div class="hint">拖動移動、滾輪或雙指縮放，撳地區佔領</div></div>
    <div class="card score" aria-live="polite"><span><b id="cnt">0</b> / 89 已佔領</span><button id="reset">重設</button></div>
  </div>
  <div class="bar">
    <div class="card" id="info">放大睇到每個地區名</div>
    <div class="btns"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="fit">全港</button></div>
  </div>
</div>
